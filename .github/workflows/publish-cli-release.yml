name: Publish CLI to NPM (Release)
on:
  release:
    types: [published]
env:
  NODE_VERSION: 24.x
permissions:
  id-token: write # Required for OIDC authentication
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update to latest npm version
        run: npm i -g npm@11.13.0
      - name: Check version correctness
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          PACKAGE_VERSION=v$(npm --prefix=src/connector-cli pkg get version | tr -d '"')
          TAG_VERSION=${GITHUB_REF#refs/tags/}

          if [ "$PACKAGE_VERSION" = "$TAG_VERSION" ]; then
              echo "The package.json version matches the tag version."
              echo "version=${PACKAGE_VERSION#v}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
              echo "The package.json version does not match the tag version."
              echo "package.json version: $PACKAGE_VERSION"
              echo "Tag version: $TAG_VERSION"
              exit 1
          fi
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn run build-cli
      - name: Configure npm registry for scoped package
        run: |
          npm config set @chili-publish:registry https://registry.npmjs.org/
      - name: Publish
        working-directory: src/connector-cli
        run: npm publish --access=public --tag=latest
      - name: Notify Teams success
        continue-on-error: true
        uses: ./.github/actions/teams-notify
        with:
          text: |
            🎉 Production Deployment Completed

            **Version:** ${{ steps.version.outputs.version }}

            **Tag:** ${{ steps.version.outputs.tag }}

            **Repository:** ${{ github.repository }}

            Deployment to Production environment completed successfully.

            [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_RELEASE_HOOK_URL }}
      - name: Notify Teams failure
        if: failure()
        uses: ./.github/actions/cd-notify-failure
        with:
          pipeline_name: Publish CLI to NPM
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_RELEASE_HOOK_URL }}
